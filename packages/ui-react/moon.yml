$schema: "../../.moon/cache/schemas/project.json"

# @slashsuite/ui-react. Each task runs the package.json script of its name (`prepack` is npm's, not a task).
# docs/ is the component docs' data and their examples (docs/examples, never packed). Lint and
# typecheck read all of it; pack-check reads docs/components (scripts/pack-docs.ts checks the tarball
# holds one agent-docs page per docs page);
# build and test leave it out of their hash. agent-docs/ ships in the package and is never
# committed: the agent-docs task writes it (the renderer is tools/docs, from the same sources as
# llms.txt), and `prepack` runs it, so npm publish packs a fresh copy.
tasks:
  # Core is vendored into dist (scripts/vendor-core.ts), from core's own build.
  build:
    command: "bun run build"
    # It vendors core's dist, which core:build writes from core's src, so that src is an input too.
    inputs: ["**/*", "!docs/**/*", "!agent-docs/**/*", "/packages/core/src/**/*"]
    outputs: ["dist"]
    deps: ["core:build"]
  # Every task reads core's source through its `development` export condition, so core's src is an
  # input of each.
  # stateMachineLayout.test.ts lays out Storybook's role machine fixture, so typecheck, lint and test
  # read that file too.
  typecheck:
    command: "bun run typecheck"
    inputs:
      [
        "**/*",
        "!docs/*.json",
        "/packages/core/src/**/*",
        "/apps/storybook/src/role-state-machine.json",
      ]
  lint:
    command: "bun run lint"
    # The testing config this project's .oxlintrc.json extends: another project's files.
    inputs:
      - "**/*"
      - "/packages/oxlint-testing/.oxlintrc.json"
      - "/packages/oxlint-testing/plugin.js"
      - "/packages/oxlint-testing/rules/**/*"
      - "/packages/core/src/**/*"
      - "/apps/storybook/src/role-state-machine.json"
  test:
    command: "bun run test"
    inputs:
      - "**/*"
      - "!docs/**/*"
      - "!agent-docs/**/*"
      - "/packages/core/src/**/*"
      - "/apps/storybook/src/role-state-machine.json"
  # Never cached: it reads tools/docs, the docs data, the examples and the themes, too many sources
  # to list as inputs, and takes seconds.
  agent-docs:
    command: "bun run agent-docs"
    options:
      cache: false
  pack-check:
    command: "bun run pack-check"
    inputs: ["**/*", "!docs/*.json", "/packages/core/src/**/*"]
    deps: ["~:build", "~:agent-docs"]
