$schema: "../../.moon/cache/schemas/project.json"

# @slashsuite/ui-react. Each task runs the package.json script of its name (`prepack` is npm's, not a task).
# docs/ is the component docs' data and their examples (docs/examples, never packed). Lint and
# typecheck read all of it; pack-check reads docs/components (scripts/pack-docs.ts checks the tarball
# holds one agent-docs page per docs page);
# build and test leave it out of their hash. agent-docs/ ships in the package and is never
# committed: the agent-docs task writes it (the renderer is the site's, from the same sources as
# /ui/llms.txt), and `prepack` runs it, so npm publish packs a fresh copy.
tasks:
  build:
    command: "bun run build"
    inputs: ["**/*", "!docs/**/*", "!agent-docs/**/*"]
    outputs: ["dist"]
  typecheck:
    command: "bun run typecheck"
    inputs: ["**/*", "!docs/*.json"]
  lint:
    command: "bun run lint"
    # The testing config this project's .oxlintrc.json extends: another project's files.
    inputs:
      ["**/*", "/packages/oxlint-testing/.oxlintrc.json", "/packages/oxlint-testing/plugin.js"]
  test:
    command: "bun run test"
    inputs: ["**/*", "!docs/**/*", "!agent-docs/**/*"]
  # Reads the built dist through the examples, so it runs after build. Never cached: it reads the
  # site's docs, the examples and the themes, too many sources to list as inputs, and takes seconds.
  agent-docs:
    command: "bun run agent-docs"
    deps: ["~:build"]
    options:
      cache: false
  pack-check:
    command: "bun run pack-check"
    inputs: ["**/*", "!docs/*.json"]
    deps: ["~:build", "~:agent-docs"]
