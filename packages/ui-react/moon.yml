$schema: "../../.moon/cache/schemas/project.json"

# @slashsuite/ui-react. Each task runs the package.json script of its name (`prepack` is npm's, not a task).
# docs/ is the component docs' data. Lint (check-slop) reads all of it; typecheck and pack-check read
# docs/components (scripts/pack-docs.ts checks the tarball holds one agent-docs page per docs page);
# build and test leave it out of their hash. agent-docs/ ships in the package, written by
# hack-cove-site:agent-docs; build and test do not read it either.
tasks:
  build:
    command: "bun run build"
    inputs: ["**/*", "!docs/**/*", "!agent-docs/**/*"]
    outputs: ["dist"]
  typecheck:
    command: "bun run typecheck"
    inputs: ["**/*", "!docs/*.json"]
  lint:
    command: "bun run lint"
    # The testing config this project's .oxlintrc.json extends: another project's files.
    inputs:
      ["**/*", "/packages/oxlint-testing/.oxlintrc.json", "/packages/oxlint-testing/plugin.js"]
  test:
    command: "bun run test"
    inputs: ["**/*", "!docs/**/*", "!agent-docs/**/*"]
  pack-check:
    command: "bun run pack-check"
    inputs: ["**/*", "!docs/*.json"]
    deps: ["~:build"]
