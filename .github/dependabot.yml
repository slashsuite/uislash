version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Nx and its plugins move together: a mixed set fails `nx release`.
      nx:
        patterns: ["nx", "@nx/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Our own packages move by a deliberate bump on a new 0.x minor, not by Dependabot.
      - dependency-name: "@slashsuite/*"

  # The actions are pinned to a commit; Dependabot moves the pin and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
