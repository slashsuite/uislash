name: Visual

# The visual check: sends the Storybook build to the project's own PixelSlash server, which renders
# each group's stories into its subproject and diffs them against main (`pixelslash upload --bundle`;
# nothing is captured on the runner, so no browser is installed). A pull request uploads only the groups its
# change reaches, each whole; a push to main uploads every group. The server's address is the PIXELSLASH_SERVER
# secret, so it is never written in this public repo. A pull
# request uploads its head commit on its own branch; a push to main uploads main, which the server
# takes as the new baseline. It uses the plain `pull_request` trigger, so a fork's pull request runs
# with no secrets and this job skips with a notice. Never switch it to `pull_request_target`: this
# job runs the pull request's code with the org token in its env.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the newest push on a ref matters: the server diffs a branch against the newest main build
# among its ancestors.
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    env:
      PIXELSLASH_TOKEN: ${{ secrets.PIXELSLASH_TOKEN }}
    steps:
      - name: Check for the PixelSlash token
        if: env.PIXELSLASH_TOKEN == ''
        run: echo "::notice::The visual check needs the PIXELSLASH_TOKEN secret, so it was skipped. A fork's pull request gets no secrets; the maintainers check its visuals."

      # The pull request's head commit, never GitHub's synthetic merge commit: the server keys the
      # build on the commit it was given, and only the head is the pull request's code. Full
      # history, since the upload finds the merge-base with origin/main and walks main's builds.
      - name: Check out hackcove
        if: env.PIXELSLASH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hackcove
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # pixelslash is not published; the upload runs its CLI from this checkout. It runs with the
      # org token in its env, so it is pinned to a commit (pixelslash main, 2026-11-27, the first
      # that keeps finalising past the diff ceiling), never a branch. Bumping it is a deliberate change of this one line. It sits beside hackcove, not in
      # it, because the upload refuses a dirty tree.
      - name: Check out pixelslash
        if: env.PIXELSLASH_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: madangryscientist/pixelslash
          ref: 6b5a0ba1bb362ef1768366496604c4166de2ab06
          path: pixelslash
          persist-credentials: false

      # The upload names the branch from `git branch --show-current`, and the checkout above is
      # detached, so a pull request's head commit is put on a branch named after the pull request's.
      # A push to main stays detached at main's tip, which uploads as main.
      - name: Name the branch
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: hackcove
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$HEAD_REF" ]; then git checkout -B "$HEAD_REF"; fi
          echo "commit: $(git rev-parse HEAD)"
          echo "branch: $(git branch --show-current)"
          echo "origin/main: $(git rev-parse origin/main)"

      - name: Set up Bun
        if: env.PIXELSLASH_TOKEN != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: hackcove/.bun-version

      - name: Install hackcove
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: hackcove
        run: bun install --frozen-lockfile

      - name: Install pixelslash
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: pixelslash
        run: bun install --frozen-lockfile

      # Every group is sent at once and the server renders them in turn; the job waits for each
      # build's diff. VISUAL_RENDER=client in this step's env is the fallback (capture here, which
      # needs Chromium installed from pixelslash/packages/engine), and switching to it re-seeds main
      # first. The task is never cached, so the remote cache is not used here. MOON_BASE is HEAD for
      # the reason ci.yml gives: moon diffs a pull request against its base before any task runs.
      - name: Upload the visual check
        if: env.PIXELSLASH_TOKEN != ''
        working-directory: hackcove
        env:
          PIXELSLASH_SERVER: ${{ secrets.PIXELSLASH_SERVER }}
          PIXELSLASH_DIR: ${{ github.workspace }}/pixelslash
          MOON_BASE: HEAD
        run: bunx moon run storybook:visual-upload
