name: CI

# Runs the gate on every pull request and on pushes to main. It uses the plain `pull_request`
# trigger, so a fork's pull request runs with a read-only token and no secrets. Never switch it to
# `pull_request_target`. The visual check is not part of CI: it needs a separate checkout and a
# private server.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. A push to main never cancels: each merge
# keeps its own run, so every commit on main has its gate and seeds the remote cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs run side by side: `gate` (typecheck, lint, test, build, pack-check, the props check and
# format) and `e2e` (Playwright over the built Storybook). The e2e job builds what it needs itself
# (moon's deps), or takes it from the remote cache, so it does not wait on the gate. The e2e job
# reuses the gate's remote cache setup and setup steps through YAML anchors, so the token rule is
# written once.
jobs:
  gate:
    runs-on: ubuntu-latest
    # moon reads and writes the shared remote cache (.moon/workspace.yml `remote:`). Every request
    # needs a token. Only a push to main writes: the job enters the `moon-cache-write` environment,
    # which GitHub lets only `main` use, and that environment alone holds MOON_CACHE_WRITE_TOKEN. A
    # pull request gets no environment and runs with the read token: it reads main's results, and its
    # own uploads are refused (moon logs a WARN per task and carries on), so a branch can never poison
    # main's cache. A fork's pull request gets no secrets: moon's first read is a 401, it logs one WARN,
    # turns the remote cache off and runs every task. Never make the write token a plain repository
    # secret, which a same-repo pull request could read. No --force in either job: that would throw the
    # cache away.
    environment: &moon-cache-environment ${{ github.event_name == 'push' && 'moon-cache-write' || '' }}
    env: &moon-cache-env
      # In a pull request moon diffs the head against the base branch before any task runs, even for
      # a plain `moon run`, and this shallow checkout has no `main`, so the gate would fail with
      # "ambiguous argument 'main'". `moon run` picks no task by that diff, so the base is HEAD
      # itself: an empty diff and no history to fetch.
      MOON_BASE: HEAD
      # A push takes the write token and nothing else, so a missing one fails the check below rather
      # than falling back to the read token. The check sees only a missing token: a revoked one shows
      # as WARN lines about failed uploads in main's log, with the job still green.
      MOON_REMOTE_TOKEN: ${{ github.event_name == 'push' && secrets.MOON_CACHE_WRITE_TOKEN || github.event_name != 'push' && secrets.MOON_CACHE_READ_TOKEN || '' }}
    steps:
      - &moon-cache-check
        name: Check main can write the remote cache
        if: github.event_name == 'push'
        run: |
          if [ -z "$MOON_REMOTE_TOKEN" ]; then
            echo "::error::The moon-cache-write environment has no MOON_CACHE_WRITE_TOKEN, so main cannot write the remote cache."
            exit 1
          fi

      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - &install
        run: bun install --frozen-lockfile

      # Three tasks at once: moon's default of one per core is too much for a shared runner.
      - run: bunx moon run --concurrency 3 :typecheck :lint :test :build :pack-check

      # The gate above ran the props task, which rewrites packages/ui-react/docs/props.json and
      # types.json from this commit's source. A diff means the committed copy is stale: run
      # `bunx moon run docs:props` and commit what it writes.
      - name: Committed props data is current
        run: git diff --exit-code packages/ui-react/docs

      - run: bun run format:check

  e2e:
    runs-on: ubuntu-latest
    # The gate's remote cache setup, by anchor: read on a pull request, write only from main through
    # the `moon-cache-write` environment. storybook:e2e is cached on its inputs (the specs and
    # everything its build reads), so a pull request that changes none of them takes main's result,
    # and any change to one runs it for real.
    environment: *moon-cache-environment
    env: *moon-cache-env
    steps:
      - *moon-cache-check
      - *checkout
      - *setup-bun
      - *install

      - run: bunx playwright install --with-deps chromium

      - run: bunx moon run storybook:e2e
