name: UI review

# Reusable: checks that a pull request builds its UI the UISlash way. A consumer repo calls it:
#
#   on: pull_request
#   jobs:
#     ui-review:
#       permissions: { contents: read, pull-requests: write }
#       uses: slashsuite/uislash/.github/workflows/ui-review.yml@main
#       secrets: inherit
#
# A private repo can run it on its own self-hosted runner with the `runs-on` input. Guard the
# calling job as well, so a fork's pull request never reaches that runner:
#
#   on: pull_request
#   jobs:
#     ui-review:
#       if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
#       permissions: { contents: read, pull-requests: write }
#       uses: slashsuite/uislash/.github/workflows/ui-review.yml@main
#       with: { runs-on: proxmox }
#       secrets: inherit
#
# `runs-on` is for private repos only: a public repo must never use the proxmox runner. Whatever
# runner a caller picks, the jobs below skip a fork's pull request on any runner but `ubuntu-latest`.
#
# Layer 1 (`rules`) is deterministic and has no model: it reads the lines the pull request adds
# and fails with file:line annotations. Layer 2 (`review`) is a model review through OpenCode Zen.
# Its findings are advisory and never fail the pull request. A review that did not happen does:
# if the model run crashes, times out or returns a reply that cannot be parsed, or the component
# reference or the GitHub comments cannot be had, the step writes an `::error` and a step summary
# and exits 1, so the check is red. It is skipped, and green, only when `OPENCODE_API_KEY` is unset,
# the model account is out of credits (a warning annotation says so), or no app file changed. A large diff is sent within a size limit; the files left out (generated
# files first) are named in the step summary and the check stays green. It uses the plain `pull_request` event, so a fork's pull request has no
# secrets and layer 2 is skipped. Never run it on `pull_request_target`: it checks out and reads
# untrusted code.
on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          The runner for every job. For private repos only: a public repo must never use the
          proxmox runner. A fork's pull request is skipped on any runner but `ubuntu-latest`.
        type: string
        default: ubuntu-latest
      paths:
        description: >-
          Globs of the app code to review, one per line; a leading `!` excludes. Empty means every
          source, markup and style file outside node_modules and dist.
        type: string
        default: ""
      hackcove-repo:
        description: The repository that holds the UISlash tools, AGENTS.md and palette.
        type: string
        default: slashsuite/uislash
      hackcove-ref:
        description: >-
          The branch, tag or sha of hackcove to read the rules and the rubric from. Pin no ref older
          than the commit that adds `.bun-version`.
        type: string
        default: main
      self:
        description: The caller is the hackcove repository itself, so read it from the checkout.
        type: boolean
        default: false
      build-rubric:
        description: >-
          Build /ui/llms.txt from the hackcove checkout instead of fetching `llms-url`. Slower, and
          exact for the ref.
        type: boolean
        default: false
      llms-url:
        description: The published component reference the model reviews against.
        type: string
        default: https://hack-cove.com/ui/llms.txt
    secrets:
      OPENCODE_API_KEY:
        description: OpenCode Zen key for layer 2. Without it the model review is skipped.
        required: false
      HACKCOVE_READ_TOKEN:
        description: A token that can read `hackcove-repo`, while that repository is private.
        required: false
      MOON_REMOTE_TOKEN:
        description: >-
          A read token for hackcove's shared moon remote cache, used only by `build-rubric`. Without
          it moon logs one 401 warning and builds everything itself.
        required: false

permissions:
  contents: read

env:
  PATHS: ${{ inputs.paths }}
  HACKCOVE_DIR: ${{ inputs.self && '.' || '.hackcove' }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  rules:
    name: Hack Cove rules
    runs-on: ${{ inputs.runs-on }}
    if: inputs.runs-on == 'ubuntu-latest' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The pull request's head, not the merge commit, so line numbers match what the diff shows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.self }}
        with:
          repository: ${{ inputs.hackcove-repo }}
          ref: ${{ inputs.hackcove-ref }}
          token: ${{ secrets.HACKCOVE_READ_TOKEN || github.token }}
          path: .hackcove
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ inputs.self && '.bun-version' || '.hackcove/.bun-version' }}

      - name: Check the added lines
        run: bun "$HACKCOVE_DIR/tools/ui-review/src/check.ts" --base "$BASE_SHA" --head "$HEAD_SHA" --hackcove "$HACKCOVE_DIR"

  # Whether the model review can run. A secret cannot be read in a job's `if`, so this job reads it
  # and says; `review` then shows as skipped, not as a green check that did nothing.
  key:
    name: Hack Cove model review key
    runs-on: ${{ inputs.runs-on }}
    if: inputs.runs-on == 'ubuntu-latest' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      set: ${{ steps.key.outputs.set }}
    steps:
      - id: key
        env:
          KEY_SET: ${{ secrets.OPENCODE_API_KEY != '' }}
        run: |
          echo "set=$KEY_SET" >> "$GITHUB_OUTPUT"
          if [ "$KEY_SET" != "true" ]; then echo "::notice title=UISlash review::OPENCODE_API_KEY is not set; the model review is skipped."; fi

  review:
    name: Hack Cove model review (advisory)
    needs: key
    runs-on: ${{ inputs.runs-on }}
    if: needs.key.outputs.set == 'true'
    # No `continue-on-error`: it would report a crash as green. The findings are advisory (the step
    # exits 0 with them); only "the review did not run" turns this red.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.self }}
        with:
          repository: ${{ inputs.hackcove-repo }}
          ref: ${{ inputs.hackcove-ref }}
          token: ${{ secrets.HACKCOVE_READ_TOKEN || github.token }}
          path: .hackcove
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ inputs.self && '.bun-version' || '.hackcove/.bun-version' }}

      # The rubric: the same generated component reference the docs publish, never a copy.
      - name: Get the component reference
        id: rubric
        env:
          NX_NO_CLOUD: "true" # a hackcove-ref from before the move to moon builds with nx; keep it off Nx Cloud
          MOON_BASE: HEAD # the hackcove checkout is shallow; see ci.yml's gate job
          MOON_REMOTE_TOKEN: ${{ secrets.MOON_REMOTE_TOKEN }}
          BUILD_RUBRIC: ${{ inputs.build-rubric }}
          LLMS_URL: ${{ inputs.llms-url }}
        run: |
          if [ "$BUILD_RUBRIC" = "true" ]; then
            # tools/docs writes it where the pinned hackcove-ref has it; an older ref builds the site
            # that used to publish it, with moon where that ref has moved to moon and Nx where not.
            if [ -d "$HACKCOVE_DIR/tools/docs" ]; then build="bunx moon run docs:llms"; out="tools/docs/dist/llms.txt"
            elif [ -f "$HACKCOVE_DIR/.moon/workspace.yml" ]; then build="bunx moon run hack-cove-site:build"; out="apps/hack-cove-site/dist/ui/llms.txt"
            else build="bunx nx run hack-cove-site:build"; out="apps/hack-cove-site/dist/ui/llms.txt"; fi
            (cd "$HACKCOVE_DIR" && bun install --frozen-lockfile && $build) \
              && echo "path=$HACKCOVE_DIR/$out" >> "$GITHUB_OUTPUT" \
              || {
                echo "::error title=UISlash review::could not build the component reference; the model review did not run."
                printf '## UISlash review\n\n**The model review did not run**: could not build the component reference.\n' >> "$GITHUB_STEP_SUMMARY"
                exit 1
              }
          elif curl --fail --silent --show-error --location "$LLMS_URL" --output "$RUNNER_TEMP/llms.txt"; then
            echo "path=$RUNNER_TEMP/llms.txt" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=UISlash review::could not fetch $LLMS_URL; the model review did not run."
            printf '## UISlash review\n\n**The model review did not run**: could not fetch %s.\n' "$LLMS_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Review the pull request
        if: ${{ steps.rubric.outputs.path != '' }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LLMS_PATH: ${{ steps.rubric.outputs.path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bun "$HACKCOVE_DIR/tools/ui-review/src/review.ts" --base "$BASE_SHA" --head "$HEAD_SHA" --hackcove "$HACKCOVE_DIR" --llms "$LLMS_PATH" --pr "$PR_NUMBER" --repo "$REPO"
