$schema: "../.moon/cache/schemas/project.json"

# @slashsuite/themes: one CSS file per theme, and its native map (`<id>.native.json`). Each task runs the package.json script of its name.
# themes.test.ts holds every theme to the palette ui-react uses and to the contrast and
# distinction contracts in themes-shared, so those files are inputs of every task that reads it.
fileGroups:
  contract:
    - "/packages/ui-react/palette.json"
    - "/packages/themes-shared/**/*"
    - "/packages/core/src/**/*"

tasks:
  typecheck:
    command: "bun run typecheck"
    inputs: ["**/*", "@group(contract)"]
  lint:
    command: "bun run lint"
    inputs: ["**/*", "@group(contract)"]
  test:
    command: "bun run test"
    inputs: ["**/*", "@group(contract)"]
  # The CSS files ship as they are; build writes each one's native map beside it, from the generator
  # in core, and the test fails on a map that is not current.
  theme-native:
    command: "bun run theme-native"
    inputs: ["*.css", "scripts/theme-native.ts", "@group(contract)"]
    outputs: ["*.native.json"]
  build:
    command: "noop"
    deps: ["~:theme-native"]
  pack-check:
    command: "bun run pack-check"
    inputs: ["**/*"]
